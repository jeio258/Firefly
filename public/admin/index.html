<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台管理 · Firefly</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-light-32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-dark-32.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/favicon/favicon-light-180.png" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simplemde@1.11.2/dist/simplemde.min.css" />
    <link rel="stylesheet" href="./styles/admin.css" />
    <script>
        // 同步前台主题：读同源 localStorage hue / theme（light|dark|system），写 --hue 与 dark class
        (() => {
            const hue = parseInt(localStorage.getItem('hue'), 10);
            if (hue >= 0 && hue <= 360) document.documentElement.style.setProperty('--hue', String(hue));
            const theme = localStorage.getItem('theme');
            const dark = theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', dark);
        })();
    </script>
</head>
<body>
    <div id="app"><div class="flex min-h-screen items-center justify-center text-sm text-slate-500"><i class="fas fa-circle-notch fa-spin mr-2"></i>正在加载后台…</div></div>
    <div id="modal-root"></div>
    <div id="toast-root" class="pointer-events-none fixed inset-x-0 top-4 z-[100] flex flex-col items-center gap-2 px-4 sm:left-auto sm:right-6 sm:items-end"></div>
    <script src="https://cdn.jsdelivr.net/npm/simplemde@1.11.2/dist/simplemde.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js" defer></script>
    <script type="module" src="./main.js"></script>
    <script>
        // 本地未选过色相时，异步读首页 config-carrier 的站点配置色相
        (async () => {
            if (localStorage.getItem('hue')) return;
            try {
                const doc = new DOMParser().parseFromString(await (await fetch('/')).text(), 'text/html');
                const h = doc.getElementById('config-carrier')?.dataset.hue;
                if (h) document.documentElement.style.setProperty('--hue', h);
            } catch {}
        })();
    </script>
</body>
</html>
